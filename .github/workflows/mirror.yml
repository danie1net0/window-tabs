# Mirrors the canonical repository, at GitLab, into this one.
#
# GitLab is where the code lives; GitHub is a read-only copy. A push made from
# a machine that only knows the GitLab remote would leave this copy behind, so
# this runs on a schedule and can also be started by hand from the Actions tab.
# It needs no secret: the source is a public repository and the push uses the
# token the runner is given.
name: mirror

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the branches and tags from GitLab
        env:
          SOURCE: https://gitlab.com/danie1net0/window-tabs.git
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet --bare "$SOURCE" source.git
          cd source.git
          # The refspecs keep the pruning inside the branches and the tags, so
          # that the refs GitHub owns, such as refs/pull, are left alone.
          git push --force --prune \
            "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          echo "Mirrored $(git rev-parse --short HEAD) from GitLab."
