# GitLab CI runs everything on Linux; this job runs the same tests on Windows from the GitHub mirror.
name: Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test koverVerify --no-daemon

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
