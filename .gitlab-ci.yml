stages:
  - lint
  - test
  - build
  - release

variables:
  GIT_DEPTH: 1
  # Gradle and the downloaded IDEs live inside the project so the runner cache can keep them between pipelines.
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain

default:
  image: eclipse-temurin:25-jdk
  interruptible: true
  cache:
    # GitLab takes at most two files: plugin versions live in build.gradle.kts, platform versions in gradle.properties.
    key:
      files:
        - build.gradle.kts
        - gradle.properties
    # Only the downloads: the extracted IDEs under caches/<version>/transforms would double the size and fill the runner's disk.
    paths:
      - .gradle-home/caches/modules-2/
      - .gradle-home/wrapper/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

ktlint:
  stage: lint
  script:
    - ./gradlew ktlintCheck
  artifacts:
    when: on_failure
    paths:
      - build/reports/ktlint/

detekt:
  stage: lint
  script:
    - ./gradlew detekt
  artifacts:
    when: always
    paths:
      - build/reports/detekt/

test:
  stage: test
  script:
    # koverVerify fails the job below 100% of lines or branches.
    - ./gradlew test koverVerify koverXmlReport koverLog
  coverage: '/application line coverage: (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - build/reports/kover/
      - build/reports/tests/
    reports:
      junit: build/test-results/test/TEST-*.xml

verify:
  stage: test
  # PhpStorm and GoLand on top of a restored cache do not fit on the shared runner's disk, so this job starts clean.
  cache: []
  script:
    # Downloads PhpStorm and GoLand (verifyIdeVersion) and checks the plugin against both.
    - ./gradlew verifyPlugin
  artifacts:
    when: always
    paths:
      - build/reports/pluginVerifier/

build:
  stage: build
  needs: [ktlint, detekt, test, verify]
  script:
    - ./gradlew buildPlugin
  artifacts:
    name: window-tabs-$CI_COMMIT_SHORT_SHA
    paths:
      - build/distributions/*.zip

# A version tag (v1.2.3) signs the plugin, attaches it to a GitLab release and, once PUBLISH_TOKEN exists,
# uploads it to JetBrains Marketplace. The signing variables are protected, so only protected v* tags see them.
.version-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

sign:
  stage: release
  extends: .version-tag
  needs: [ktlint, detekt, test, verify]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    # The tag and gradle.properties must name the same version, or the release would ship a mislabeled zip.
    - test "$(sed -n 's/^pluginVersion = //p' gradle.properties)" = "$VERSION"
    - ./gradlew verifyPluginSignature
    - ./gradlew getChangelog --project-version="$VERSION" --no-header --no-links --console=plain -q > release-notes.md
    - command -v curl || (apt-get update -qq && apt-get install -y -qq curl)
    - >-
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "build/distributions/window-tabs-$VERSION-signed.zip"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/window-tabs/$CI_COMMIT_TAG/window-tabs-$CI_COMMIT_TAG.zip"
  artifacts:
    paths:
      - build/distributions/*-signed.zip
      - release-notes.md

gitlab-release:
  stage: release
  extends: .version-tag
  needs: [sign]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  cache: []
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Window Tabs $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: window-tabs-$CI_COMMIT_TAG.zip
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/window-tabs/$CI_COMMIT_TAG/window-tabs-$CI_COMMIT_TAG.zip
          link_type: package

marketplace:
  stage: release
  needs: [sign]
  rules:
    # The first version goes up by hand on plugins.jetbrains.com; later ones go through here once the token exists.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $PUBLISH_TOKEN
  script:
    - ./gradlew publishPlugin
